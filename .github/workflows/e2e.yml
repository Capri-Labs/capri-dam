# ─────────────────────────────────────────────────────────────────────────────
# Capri DAM — E2E Tests (Playwright)
#
# Runs the Playwright end-to-end suite against a live Rails server (spun up
# inside the workflow using Docker Compose-style services). The 59
# *.e2e.spec.js files are split into 8 feature-based suites (see the
# `matrix.suite` list in the `playwright` job below) that each run as an
# independent parallel job with its own Postgres/Redis services and Rails
# server, instead of one long sequential job. `e2e-all-green` aggregates the
# matrix into a single pass/fail check.
#
# Triggers:
#   - Push to main/master
#   - Pull-request (as a required check)
#   - Manual dispatch (with optional base URL override)
#
# Required secrets:
#   RAILS_MASTER_KEY    — Rails credentials key
#   E2E_EMAIL           — Admin login for tests (default: admin@admin.com)
#   E2E_PASSWORD        — Admin password
# ─────────────────────────────────────────────────────────────────────────────
name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to run E2E against (default: http://localhost:3000)"
        required: false
        default: "http://localhost:3000"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUBY_VERSION: "4.0.3"
  NODE_VERSION: "22"
  BUNDLE_WITHOUT: "production"
  RAILS_ENV: test
  DATABASE_URL: postgres://headless_dam:headless_dam@localhost:5432/headless_dam_e2e
  REDIS_URL: redis://localhost:6379/0
  E2E_BASE_URL: ${{ inputs.base_url || 'http://localhost:3000' }}

jobs:
  playwright:
    name: Playwright E2E (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # ── Feature-suite matrix ────────────────────────────────────────────
      # The 59 *.e2e.spec.js files are grouped into 8 feature-based suites so
      # they run as independent parallel jobs instead of one 30+ minute
      # sequential job. Each `specs` value is a space-separated list of
      # filename fragments passed straight to `playwright test <fragment>`,
      # which matches any spec file whose path contains that fragment.
      # When adding a new *.e2e.spec.js file, add its basename (no
      # `.e2e.spec.js` suffix) to whichever suite below best matches it.
      matrix:
        suite:
          - name: access-control
            specs: >-
              access_control_security auth impersonation
              header_impersonate_groups group_hierarchy users_and_groups
              folder_access_tab security_policies
          - name: assets-core
            specs: >-
              asset_3d_viewer asset_download asset_serving
              asset_thumbnail_states asset_version_diff
              asset_viewer_edit_image asset_viewer_exif_and_layout
              image_asset_formats document_asset_formats
              video_asset_management
          - name: folders-workspace
            specs: >-
              folders_crud folders_view_toggle folders_workspace_coverage
              copy_folder_asset move_folder_asset rename_folder_asset
              collections_workspace duplicate_manager_workspace
          - name: delivery-cdn
            specs: >-
              delivery_cdn_cache_purge delivery_cdn_image_video_profiles
              delivery_cdn_provider_switch cdn_image_optimizer_formats
              origin_storage_settings smtp_settings
          - name: search-metadata
            specs: >-
              global_search_bar semantic_search semantic_cluster_map
              search_and_duplicates_fixes metadata_tools data_health
          - name: workflow-ingestion
            specs: >-
              workflow_designer ingestion_migration_lifecycle
              ingestion_pipeline publish_asset quarantine provenance_c2pa
          - name: system-admin
            specs: >-
              feature_flags_tab operational_logging_tab
              system_observability_tab ai_gateway_controls_tab
              reports_screen audit_log style_model_hub
          - name: misc-ui-comms
            specs: >-
              dashboard footer_redesign custom_404_page
              language_switching upload_overlay_tags_and_bin inbox
              email_engine bin

    services:
      postgres:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: headless_dam
          POSTGRES_PASSWORD: headless_dam
          POSTGRES_DB: headless_dam_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips node-gyp exiv2 imagemagick libimage-exiftool-perl

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby ${{ env.RUBY_VERSION }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Build JS assets
        run: yarn build

      - name: Prepare E2E database & seed
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          SECRET_KEY_BASE: ${{ secrets.RAILS_MASTER_KEY || 'ci_e2e_placeholder_secret_key_base_that_is_at_least_64_chars_long_required' }}
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: test-ar-enc-primary-key-32bytes!
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: test-ar-enc-det-key-32bytes!!!!!
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: test-ar-enc-derivation-salt32b!!
        run: |
          bundle exec rails db:create
          bundle exec rails db:migrate
          bundle exec rails db:seed

      - name: Start Sidekiq worker in background
        # config.active_job.queue_adapter is :sidekiq app-wide, so any test
        # that depends on a background job (asset ZIP downloads, ingestion,
        # workflow transitions, CDN invalidation, email sending, etc.) will
        # hang until its 30s Playwright timeout unless a real worker is
        # consuming the Redis queue. This step was previously missing.
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          SECRET_KEY_BASE: ${{ secrets.RAILS_MASTER_KEY || 'ci_e2e_placeholder_secret_key_base_that_is_at_least_64_chars_long_required' }}
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: test-ar-enc-primary-key-32bytes!
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: test-ar-enc-det-key-32bytes!!!!!
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: test-ar-enc-derivation-salt32b!!
        run: |
          bundle exec sidekiq -e test > /tmp/sidekiq.log 2>&1 &
          echo "Sidekiq PID: $!"

      - name: Start Rails server in background
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          SECRET_KEY_BASE: ${{ secrets.RAILS_MASTER_KEY || 'ci_e2e_placeholder_secret_key_base_that_is_at_least_64_chars_long_required' }}
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: test-ar-enc-primary-key-32bytes!
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: test-ar-enc-det-key-32bytes!!!!!
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: test-ar-enc-derivation-salt32b!!
        run: |
          # Bind to 0.0.0.0 so the health-check curl can reach it
          bundle exec rails server -b 0.0.0.0 -p 3000 -e test > /tmp/rails-server.log 2>&1 &
          SERVER_PID=$!
          echo "Rails server PID: $SERVER_PID"
          # Wait up to 90 s (45 × 2 s) for the /up health-check to respond
          for i in $(seq 1 45); do
            if curl -sf --max-time 2 http://localhost:3000/up; then
              echo "Rails server is ready (attempt $i)"
              break
            fi
            # If the process already exited, bail out early
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::Rails server process exited unexpectedly (attempt $i)"
              break
            fi
            echo "Waiting for server... attempt $i/45"
            sleep 2
          done
          # Hard-fail the step if the server still isn't answering
          if ! curl -sf --max-time 2 http://localhost:3000/up; then
            echo "::error::Rails server did not start within 90 s"
            echo "=== Last 100 lines of server log ==="
            tail -100 /tmp/rails-server.log || true
            exit 1
          fi

      - name: Run Playwright tests
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL || 'admin@admin.com' }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'AdminUser' }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          SECRET_KEY_BASE: ${{ secrets.RAILS_MASTER_KEY || 'ci_e2e_placeholder_secret_key_base_that_is_at_least_64_chars_long_required' }}
        run: yarn playwright test ${{ matrix.suite.specs }} --reporter=html

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.suite.name }}
          path: coverage-frontend/playwright-report/
          retention-days: 30

      - name: Upload E2E screenshots on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-screenshots-${{ matrix.suite.name }}
          path: coverage-frontend/playwright-report/
          if-no-files-found: ignore

  # ── Aggregation gate ─────────────────────────────────────────────────────
  # A single required-check-friendly job that fails if any suite in the
  # matrix above failed, mirroring the `sast-all-green` pattern in
  # .github/workflows/sast.yml.
  e2e-all-green:
    name: All E2E suites passed
    runs-on: ubuntu-latest
    needs: [playwright]
    if: always()

    steps:
      - name: Evaluate E2E matrix results
        run: |
          if [[ "${{ needs.playwright.result }}" != "success" ]]; then
            echo "One or more E2E suites failed — see the Playwright job matrix above."
            exit 1
          fi
          echo "All E2E suites passed ✅"

