# ─────────────────────────────────────────────────────────────────────────────
# Capri DAM — Main CI Pipeline
#
# Triggered on every push and pull-request.
#
# Jobs:
#   lint     → RuboCop (Ruby style)
#   security → Brakeman + bundler-audit (CVE check)
#   rspec    → Full backend test suite (models, requests, system)
#   jest     → Frontend unit & component tests
#   all-green→ Required gate for branch protection
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RUBY_VERSION: "4.0.6"
  NODE_VERSION: "22"
  BUNDLE_WITHOUT: "production"

# ─────────────────────────────────────────────────────────────────────────────
jobs:
  # ─── 1. Ruby lint ───────────────────────────────────────────────────────────
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby ${{ env.RUBY_VERSION }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Cache RuboCop offenses
        uses: actions/cache@v6
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ hashFiles('.ruby-version','**/.rubocop.yml','Gemfile.lock') }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ hashFiles('.ruby-version','**/.rubocop.yml','Gemfile.lock') }}-

      - name: Run RuboCop
        run: bin/rubocop --format github

  # ─── 2. Security scan ───────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby ${{ env.RUBY_VERSION }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Brakeman — Rails static analysis
        run: |
          bundle exec brakeman \
            --no-pager \
            --format github \
            --ignore-config .brakeman/ignore.json \
            --exit-on-warn

      - name: Brakeman — SARIF output for Security tab
        if: always()
        run: |
          bundle exec brakeman \
            --no-pager \
            --format sarif \
            --output tmp/brakeman.sarif \
            --ignore-config .brakeman/ignore.json \
            || true

      - name: Upload Brakeman SARIF
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: brakeman-sarif
          path: tmp/brakeman.sarif

      - name: bundler-audit — Ruby gem CVE check
        run: bundle exec bundler-audit check --update --config config/bundler-audit.yml

      - name: yarn audit — JS production dependency CVE check
        run: yarn audit --groups dependencies --level high
        continue-on-error: true

  # ─── 3. Backend tests (RSpec) ───────────────────────────────────────────────
  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: headless_dam
          POSTGRES_PASSWORD: headless_dam
          POSTGRES_DB: headless_dam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://headless_dam:headless_dam@localhost:5432/headless_dam_test
      REDIS_URL: redis://localhost:6379/0
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      # Fallback encryption keys for when RAILS_MASTER_KEY is not set (e.g. forks)
      SECRET_KEY_BASE: ci_placeholder_secret_key_base_that_is_at_least_64_chars_long_required
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "test-ar-enc-primary-key-32bytes!"
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "test-ar-enc-det-key-32bytes!!!!!"
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "test-ar-enc-derivation-salt32b!!"

    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpq-dev libvips node-gyp exiv2 libimage-exiftool-perl
          # Ubuntu ships ImageMagick 6, which provides only `convert`. mini_magick 5.x
          # drives the ImageMagick 7 `magick` binary and ignores `convert`, so the apt
          # package is not usable here: without this the image pipeline silently falls
          # back to serving originals. Installed from the upstream portable build.
          IM_VERSION=7.1.2-31
          curl -fsSL -o /tmp/magick.AppImage \
            "https://github.com/ImageMagick/ImageMagick/releases/download/$IM_VERSION/ImageMagick-$IM_VERSION-gcc-x86_64.AppImage"
          chmod +x /tmp/magick.AppImage
          # Extracted rather than run directly: the runners have no FUSE.
          (cd /tmp && ./magick.AppImage --appimage-extract > /dev/null)
          sudo rm -rf /opt/imagemagick
          sudo mv /tmp/squashfs-root /opt/imagemagick
          sudo ln -sf /opt/imagemagick/AppRun /usr/local/bin/magick
          magick -version

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby ${{ env.RUBY_VERSION }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Build JS assets (esbuild → app/assets/builds/)
        run: yarn build

      - name: Precompile assets for Propshaft (test env)
        run: bundle exec rails assets:precompile

      - name: Prepare test database
        run: bundle exec rails db:test:prepare

      - name: Run RSpec (unit + integration)
        run: |
          COVERAGE=true bundle exec rspec \
            --format progress \
            --format RspecJunitFormatter \
            --out tmp/rspec-results.xml

      - name: Upload RSpec test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rspec-results
          path: tmp/rspec-results.xml

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-backend
          path: coverage/backend/

      # The badge is only published from a green run on master: a coverage
      # figure taken from a suite that failed part-way through is misleading.
      - name: Generate coverage badge data
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          mkdir -p .github/badges
          ruby -rjson -e '
            data  = JSON.parse(File.read("coverage/backend/.last_run.json"))
            line  = data.dig("result", "line").to_f
            color = line >= 95 ? "brightgreen" : line >= 90 ? "green" : line >= 80 ? "yellow" : "red"
            File.write(".github/badges/coverage.json", JSON.generate({
              schemaVersion: 1,
              label: "coverage",
              message: format("%.2f%%", line),
              color: color,
            }))
          '

      # master is covered by a ruleset that requires pull requests and signed
      # commits, so CI cannot push the badge there. The badge is instead
      # published to the orphan `badges` branch, which carries no history of
      # its own and sits outside the ruleset. README points shields.io at that
      # branch.
      - name: Publish coverage badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          badge=$(mktemp)
          cp .github/badges/coverage.json "$badge"

          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work=$(mktemp -d)

          if git clone --depth=1 --branch badges --quiet "$remote" "$work" 2>/dev/null; then
            echo "Reusing existing badges branch."
          else
            echo "Creating the badges branch."
            git clone --depth=1 --quiet "$remote" "$work"
            git -C "$work" checkout --quiet --orphan badges
            git -C "$work" rm -rqf .
          fi

          mkdir -p "$work/.github/badges"
          cp "$badge" "$work/.github/badges/coverage.json"

          git -C "$work" config user.name  "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add .github/badges/coverage.json

          if git -C "$work" diff --quiet --cached; then
            echo "Coverage unchanged; nothing to publish."
          else
            git -C "$work" commit --quiet -m "chore: update coverage badge [skip ci]"
            git -C "$work" push --quiet origin badges
            echo "Published $(cat "$badge")"
          fi

  # ─── 4. Frontend unit tests (Jest) ──────────────────────────────────────────
  jest:
    name: Jest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Run Jest with coverage
        run: yarn jest --coverage --ci

      - name: Upload frontend unit coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-frontend-unit
          path: coverage-frontend/unit/

  # ─── 5. System tests (Rails system) ────────────────────────────────────────
  system-test:
    name: System Tests
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: headless_dam
          POSTGRES_PASSWORD: headless_dam
          POSTGRES_DB: headless_dam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://headless_dam:headless_dam@localhost:5432/headless_dam_test
      REDIS_URL: redis://localhost:6379/0
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      SECRET_KEY_BASE: ci_placeholder_secret_key_base_that_is_at_least_64_chars_long_required
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "test-ar-enc-primary-key-32bytes!"
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "test-ar-enc-det-key-32bytes!!!!!"
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "test-ar-enc-derivation-salt32b!!"

    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpq-dev libvips node-gyp exiv2 libimage-exiftool-perl
          # Ubuntu ships ImageMagick 6, which provides only `convert`. mini_magick 5.x
          # drives the ImageMagick 7 `magick` binary and ignores `convert`, so the apt
          # package is not usable here: without this the image pipeline silently falls
          # back to serving originals. Installed from the upstream portable build.
          IM_VERSION=7.1.2-31
          curl -fsSL -o /tmp/magick.AppImage \
            "https://github.com/ImageMagick/ImageMagick/releases/download/$IM_VERSION/ImageMagick-$IM_VERSION-gcc-x86_64.AppImage"
          chmod +x /tmp/magick.AppImage
          # Extracted rather than run directly: the runners have no FUSE.
          (cd /tmp && ./magick.AppImage --appimage-extract > /dev/null)
          sudo rm -rf /opt/imagemagick
          sudo mv /tmp/squashfs-root /opt/imagemagick
          sudo ln -sf /opt/imagemagick/AppRun /usr/local/bin/magick
          magick -version

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby ${{ env.RUBY_VERSION }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Build JS assets
        run: yarn build

      - name: Precompile assets for Propshaft (test env)
        run: bundle exec rails assets:precompile

      - name: Prepare test database
        run: bundle exec rails db:test:prepare

      - name: Run system tests (RSpec)
        run: bundle exec rspec spec/system/ --format progress

      - name: Upload screenshots from failed tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: system-test-screenshots
          path: tmp/screenshots
          if-no-files-found: ignore

  # ─── 6. All-green gate (required for branch protection) ─────────────────────
  all-green:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [lint, security, rspec, jest, system-test]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ||
                "${{ needs.security.result }}" != "success" ||
                "${{ needs.rspec.result }}" != "success" ||
                "${{ needs.jest.result }}" != "success" ||
                "${{ needs.system-test.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI checks passed ✅"
